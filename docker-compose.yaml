services:
  mc:
    image: itzg/minecraft-server:2026.5.4-java25-alpine
    hostname: minecraft
    container_name: minecraft
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: '1'
          memory: 3G
        limits:
          cpus: '2'
          memory: 6144M
    environment:
      UID: "${UID:-998}"
      GID: "${GID:-998}"
      TZ: "America/Argentina/Buenos_Aires"
      MEMORY: "3G"
      TYPE: "PAPER"
      EULA: "true"
      VERSION: "26.1.2"
      SPIGET_RESOURCES: 75871,18083,96014,64270,59773
      REMOVE_OLD_MODS: "TRUE"
      REMOVE_OLD_MODS_EXCLUDE: "TRUE"
      MOTD: "\u00A7e\u00A7lServidor\u00A7a\u00A7l Survival\u00A7c\u00A7l (Paper 26.1.2)"
      DIFFICULTY: normal
      SPAWN_PROTECTION: 0
      OPS: "${MC_OPS}"
      ICON: "./server-icon.png"
      MAX_PLAYERS: "4"
      PVP: "true"
      ONLINE_MODE: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      WHITELIST: "${MC_WHITELIST}"
      EXISTING_WHITELIST_FILE: SYNCHRONIZE
      CONSOLE: "false"
      ENABLE_ROLLING_LOGS: "true"
      OVERRIDE_SERVER_PROPERTIES: "true"
    ports:
      - 9993:25565
    volumes:
      - ./mc-paper:/data
      - ./host-plugins:/plugins:ro
